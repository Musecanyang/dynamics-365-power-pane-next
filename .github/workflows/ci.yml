name: CI

# Static guardrails for the extension sources: Node parse check and manifest
# JSON verification, the constants <-> MAIN-world bridge marker assertion,
# ESLint and unit tests. Loading the extension in a browser remains the final
# acceptance step for behaviour.

on:
  push:
    branches: ["**"]
  pull_request:

jobs:
  ci:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - name: Install tooling
        run: npm ci

      - name: Syntax check all shipped scripts
        run: npm run check

      - name: Lint
        run: npm run lint

      - name: Unit tests
        run: npm test
