name: CI

# Quality gate for the extension sources: ESLint plus the unit tests, which
# include the guardrails (parse every shipped script, validate the manifest
# JSON, assert the constants <-> MAIN-world bridge marker sync). Loading the
# extension in a browser remains the final acceptance step for behaviour.

on:
  push:
    branches: ["**"]
  pull_request:

jobs:
  ci:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - name: Install tooling
        run: npm ci

      - name: Lint
        run: npm run lint

      - name: Unit tests (includes parse + manifest + bridge-marker guardrails)
        run: npm test
