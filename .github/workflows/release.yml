name: Release

# Creates a GitHub Release whenever a version tag (v1.2.3) is pushed, using the
# matching section of CHANGELOG.md as the release notes. Publishing a Release is
# a separate step from pushing the tag itself - this workflow automates it.
on:
  push:
    tags:
      - "v*"

# Only the built-in token is needed; `contents: write` lets it create the Release.
permissions:
  contents: write

jobs:
  release:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Extract release notes from CHANGELOG.md
        run: |
          node <<'NODE'
          const fs = require("fs");

          const tag = process.env.GITHUB_REF_NAME; // e.g. "v1.1.0"
          const version = tag.replace(/^v/, "");
          const changelog = fs.readFileSync("CHANGELOG.md", "utf8").split(/\r?\n/);

          // Find the heading for this version, then take every line up to the
          // next version heading and drop the trailing link definitions.
          const isHeading = (line) => /^##\s+\[/.test(line);
          const start = changelog.findIndex((line) => line.startsWith("## [" + version + "]"));
          if (start === -1) {
            console.error("No CHANGELOG.md section for " + version);
            process.exit(1);
          }
          let end = changelog.length;
          for (let i = start + 1; i < changelog.length; i++) {
            if (isHeading(changelog[i])) {
              end = i;
              break;
            }
          }

          const notes = changelog
            .slice(start + 1, end)
            .join("\n")
            .replace(/\n+\[[^\]]+\]:\s+\S+[\s\S]*$/, "")
            .trim();
          if (!notes) {
            console.error("CHANGELOG.md section for " + version + " is empty");
            process.exit(1);
          }

          fs.writeFileSync("release-notes.md", notes + "\n");
          console.log("Prepared notes for " + version + " (" + notes.split("\n").length + " lines)");
          NODE

      - name: Package the extension
        # The GitHub Release gets a zip with ONLY the files the browser needs
        # (the automatically attached "Source code (zip)" also carries the
        # repo tooling: tests / scripts / workflows / docs, which users should
        # never have to unpack to run the extension).
        run: |
          node <<'NODE'
          const fs = require("fs");
          const path = require("path");

          const EXTENSION_ROOTS = ["shared", "content", "options", "icons"];
          const files = [
            "manifest.json",
            "background.js",
            "LICENSE",
            "README.md"
          ];

          function walk(dir) {
            let out = [];
            for (const entry of fs.readdirSync(dir, { withFileTypes: true })) {
              const full = path.join(dir, entry.name);
              if (entry.isDirectory()) out = out.concat(walk(full));
              else files.push(full);
            }
            return out;
          }
          EXTENSION_ROOTS.forEach(walk);
          files.forEach(function (f) {
            if (!fs.existsSync(f)) throw new Error("Missing release file: " + f);
          });
          fs.writeFileSync("files.txt", files.join("\n") + "\n");
          console.log("Packaging " + files.length + " files");
          NODE
          zip -q "power-pane-next-${GITHUB_REF_NAME}.zip" -@ < files.txt
          unzip -l "power-pane-next-${GITHUB_REF_NAME}.zip"

      - name: Create GitHub Release (idempotent)
        env:
          GH_TOKEN: ${{ github.token }}
        # Idempotent: a re-run (e.g. after a history rewrite / forced tag push)
        # must not fail on an already-existing Release. If it exists, keep the
        # notes and refresh the extension zip asset instead.
        run: |
          if gh release view "$GITHUB_REF_NAME" --json id > /dev/null 2>&1; then
            gh release upload "$GITHUB_REF_NAME" \
              "power-pane-next-${GITHUB_REF_NAME}.zip" --clobber
            echo "Release $GITHUB_REF_NAME already existed - refresh the zip asset."
          else
            gh release create "$GITHUB_REF_NAME" \
              "power-pane-next-${GITHUB_REF_NAME}.zip" \
              --title "$GITHUB_REF_NAME" \
              --notes-file release-notes.md \
              --verify-tag
          fi
