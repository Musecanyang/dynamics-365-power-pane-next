name: Feature request
description: Suggest a new action or improvement
title: "[Feature]: "
labels: ["enhancement"]
body:
  - type: markdown
    attributes:
      value: |
        Thanks for the suggestion. Please describe the use case, not just the UI.
  - type: textarea
    id: problem
    attributes:
      label: Problem / use case
      description: What are you trying to do that is hard today?
    validations:
      required: true
  - type: textarea
    id: proposal
    attributes:
      label: Proposed solution
      description: What should the action do? Where should it live (which group)?
    validations:
      required: true
  - type: textarea
    id: alternatives
    attributes:
      label: Alternatives considered
  - type: input
    id: docs
    attributes:
      label: Relevant Microsoft documentation
      description: If this uses a Dataverse / client API feature, link the docs.
