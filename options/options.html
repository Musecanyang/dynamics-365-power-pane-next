<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <title>Dynamics 365 Power Pane Next - Options</title>
    <style>
      :root { --bd: #e2e6eb; --bd-soft: #f1f3f5; --sub: #6b7280; --accent: #3a63ff; }
      * { box-sizing: border-box; }
      body { font: 12.5px/1.45 -apple-system, "Segoe UI", Roboto, sans-serif; margin: 16px 20px 20px; color: #1c1f26; max-width: 1400px; }
      header { position: sticky; top: 0; background: #fff; z-index: 4; padding: 2px 0 8px; border-bottom: 1px solid var(--bd); margin-bottom: 10px; }
      h1 { font-size: 14.5px; margin: 0; display: inline-block; }
      p.hint { color: var(--sub); margin: 0 0 10px; font-size: 11.5px; }
      .toolbar { display: flex; gap: 8px; align-items: center; margin: 8px 0 0; flex-wrap: wrap; font-size: 12px; }
      .toolbar label { color: var(--sub); }
      select { padding: 3px 7px; border: 1px solid var(--bd); border-radius: 6px; font-size: 12px; }
      /* Group cards flow into as many columns as the window fits, so ~50
         actions no longer require an endless single-column page. */
      #list { display: grid; grid-template-columns: repeat(auto-fill, minmax(430px, 1fr)); gap: 10px; align-items: start; }
      fieldset { border: 1px solid var(--bd); border-radius: 8px; margin: 0; min-width: 0; padding: 6px 10px 8px; }
      legend { font-weight: 700; padding: 0 5px; font-size: 11px; text-transform: uppercase; letter-spacing: .06em; color: var(--sub); }
      .row { display: flex; align-items: center; gap: 7px; padding: 2px 3px; border-bottom: 1px solid var(--bd-soft); }
      .row:hover { background: #f7f9fb; }
      .row:last-child { border-bottom: none; }
      .row.disabled { color: #9ca3af; }
      .row.dragging { opacity: .5; }
      .row input[type="checkbox"] { margin: 0; flex: none; }
      .handle { cursor: grab; color: #c3c8cf; user-select: none; font-size: 10px; flex: none; }
      .row:hover .handle { color: var(--sub); }
      .lbl { flex: 1; cursor: pointer; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
      .sc { min-width: 100px; flex: none; text-align: center; font-family: ui-monospace, Consolas, monospace; font-size: 11px; border: 1px solid var(--bd); background: #fff; border-radius: 6px; padding: 2px 7px; cursor: pointer; color: #374151; }
      .sc.recording { background: #fef3c7; border-color: #f59e0b; }
      .bar { position: sticky; bottom: 0; z-index: 4; display: flex; gap: 8px; align-items: center; margin: 12px -20px 0; padding: 10px 20px; flex-wrap: wrap; border-top: 1px solid var(--bd); background: #fff; }
      button { border: 1px solid var(--bd); background: #fff; border-radius: 6px; padding: 4px 11px; cursor: pointer; font-size: 12px; }
      button:hover { background: #f3f5f8; }
      button.primary { background: var(--accent); border-color: var(--accent); color: #fff; }
      button.primary:hover { filter: brightness(1.08); background: var(--accent); }
      button.danger { border-color: #ef4444; color: #ef4444; }
      #status { color: #16a34a; margin-left: 4px; font-size: 12px; }
      input[type="checkbox"] { accent-color: var(--accent); }
    </style>
  </head>
  <body>
    <header>
      <h1 id="title">Options</h1>
      <p class="hint">
        Drag rows within a group to reorder. Uncheck to hide an action (hidden ones sink to the bottom).
        Click a shortcut cell then press a key combo (needs a modifier); press Backspace/Delete to clear.
      </p>
    </header>
    <div class="toolbar">
      <label>Theme:</label>
      <select id="theme">
        <option value="dark">Dark</option>
        <option value="light">Light</option>
      </select>
    </div>
    <div id="list"></div>
    <div class="bar">
      <button type="button" id="all">Select all</button>
      <button type="button" id="none">Deselect all</button>
      <button type="button" id="resetPos">Reset pane position</button>
      <button type="button" id="exportSettings">Export settings</button>
      <button type="button" id="importSettings">Import settings</button>
      <button type="button" class="danger" id="restore">Restore default settings</button>
      <button type="button" class="primary" id="save">Save</button>
      <span id="status"></span>
    </div>
    <script src="../shared/constants.js"></script>
    <script src="../shared/util.js"></script>
    <script src="../shared/actions.js"></script>
    <script src="options.js"></script>
  </body>
</html>
