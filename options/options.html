<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <title>Dynamics 365 Power Pane Next - Options</title>
    <style>
      body { font: 13px/1.5 -apple-system, "Segoe UI", Roboto, sans-serif; margin: 24px; color: #1c1f26; }
      h1 { font-size: 16px; margin: 0 0 4px; }
      p.hint { color: #6b7280; margin: 0 0 14px; }
      .toolbar { display: flex; gap: 10px; align-items: center; margin-bottom: 14px; flex-wrap: wrap; }
      select { padding: 5px 8px; border: 1px solid #d1d5db; border-radius: 6px; }
      fieldset { border: 1px solid #e5e7eb; border-radius: 8px; margin: 0 0 12px; padding: 6px 12px 10px; }
      legend { font-weight: 600; padding: 0 6px; }
      .row { display: flex; align-items: center; gap: 8px; padding: 4px; border-bottom: 1px solid #f1f3f5; }
      .row:last-child { border-bottom: none; }
      .row.disabled { color: #9ca3af; }
      .row.dragging { opacity: .5; }
      .handle { cursor: grab; color: #9ca3af; user-select: none; }
      .lbl { flex: 1; cursor: pointer; }
      .sc { min-width: 108px; text-align: center; font-family: ui-monospace, Consolas, monospace; font-size: 11.5px; border: 1px solid #d1d5db; background: #fff; border-radius: 6px; padding: 3px 8px; cursor: pointer; }
      .sc.recording { background: #fef3c7; border-color: #f59e0b; }
      .bar { display: flex; gap: 8px; align-items: center; margin-top: 16px; flex-wrap: wrap; }
      button { border: 1px solid #d1d5db; background: #fff; border-radius: 6px; padding: 6px 12px; cursor: pointer; }
      button.primary { background: #3a63ff; border-color: #3a63ff; color: #fff; }
      button.danger { border-color: #ef4444; color: #ef4444; }
      #status { color: #16a34a; margin-left: 8px; }
    </style>
  </head>
  <body>
    <h1 id="title">Options</h1>
    <p class="hint">
      Drag rows within a group to reorder. Uncheck to hide an action (hidden ones sink to the bottom).
      Click a shortcut cell then press a key combo (needs a modifier); press Backspace/Delete to clear.
    </p>
    <div class="toolbar">
      <label>Theme:</label>
      <select id="theme">
        <option value="dark">Dark</option>
        <option value="light">Light</option>
      </select>
    </div>
    <div id="list"></div>
    <div class="bar">
      <button type="button" id="all">Select all</button>
      <button type="button" id="none">Deselect all</button>
      <button type="button" id="resetPos">Reset pane position</button>
      <button type="button" class="danger" id="restore">Restore default settings</button>
      <button type="button" class="primary" id="save">Save</button>
      <span id="status"></span>
    </div>
    <script src="../src/constants.js"></script>
    <script src="../src/actions.js"></script>
    <script src="options.js"></script>
  </body>
</html>
